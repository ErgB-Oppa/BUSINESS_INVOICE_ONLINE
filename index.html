<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invoice Keeper</title>
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Invoice Keeper">

<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#6b7380;--ac:#0f766e;--acx:#fff;--bd:#e2e5ea;--red:#c62828;--amb:#b45309;--grn:#15803d;--b1:#fff0f7;--b2:#fff7ee;--b3:#eafaf0;--patop:.26;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1e2329;--tx:#eceff3;--mut:#98a2b0;--ac:#2dd4bf;--acx:#06201d;--bd:#2f363f;--red:#ef6b6b;--amb:#f0a64a;--grn:#4ade80;--b1:#2b1026;--b2:#1c1430;--b3:#0d251c;--patop:.20;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1e2329;--tx:#eceff3;--mut:#98a2b0;--ac:#2dd4bf;--acx:#06201d;--bd:#2f363f;--red:#ef6b6b;--amb:#f0a64a;--grn:#4ade80;--b1:#2b1026;--b2:#1c1430;--b3:#0d251c;--patop:.20;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
#app{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:15px;margin:16px 0 8px;color:var(--mut);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:13px}.b{font-weight:600}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.red{color:var(--red)}.amb{color:var(--amb)}.grn{color:var(--grn)}
button{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:var(--ac);color:var(--acx);font-weight:600}
button.s{background:transparent;color:var(--ac);border:1px solid var(--bd)}button.d{background:transparent;color:var(--red);border:1px solid var(--bd)}
button.sm{padding:6px 10px;font-size:14px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin:4px 0 10px}
label{font-size:13px;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:12px 4px;font-size:13px}nav button.on{color:var(--ac)}
.banner{background:var(--card);border:1px solid var(--amb);border-left-width:5px;border-radius:12px;padding:12px;margin-bottom:12px}
.sheet{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 40px;z-index:20}
.sheet>div{max-width:640px;margin:0 auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{display:grid;grid-template-columns:1fr 60px 90px 34px;gap:6px;align-items:start}.item input{margin:0 0 6px}
.bar{height:8px;border-radius:99px;background:var(--bd);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac)}.sub{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);padding:2px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow{text-align:center;font-size:12px;color:var(--mut)}
.day{min-height:54px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:4px;display:flex;flex-direction:column;justify-content:space-between;font-size:12px;overflow:hidden}
.day.has{border-color:var(--ac)}.day.has b{color:var(--ac);font-size:12px;word-break:break-all}.day.tod span{font-weight:700;text-decoration:underline}.day.sel{background:var(--ac);color:var(--acx)}.day.sel b{color:var(--acx)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:99;max-width:90%;text-align:center}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}.dlg .box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;max-width:340px;width:100%}
input[readonly]{background:var(--card);font-weight:600}
.bgfx{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;background:linear-gradient(135deg,var(--b1),var(--b2) 50%,var(--b3))}

.bgfx::after{content:"";position:absolute;inset:0;background-image:radial-gradient(currentColor 1px,transparent 1.5px);background-size:26px 26px;opacity:.05;color:var(--tx)}
@keyframes patdrift{from{transform:translate3d(0,0,0)}to{transform:translate3d(360px,235px,0)}}
.sp{position:absolute;color:#37aa49;opacity:.22;animation:tw 4s ease-in-out var(--dl) infinite alternate}
.sp.p{color:#e50c74}

#app{position:relative;z-index:1}nav{z-index:3}
.dm{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--bd);border-radius:10px}
.dmt{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}
.dmt th,.dmt td{border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);padding:7px 8px;text-align:right}
.dmt th:first-child,.dmt td:first-child{position:sticky;left:0;background:var(--card);text-align:left;z-index:1;font-weight:600}
.dmt thead th{position:sticky;top:0;background:var(--card);z-index:2}
.dmt td:not(:first-child){cursor:pointer}
.dmt tr.b td{font-weight:700;background:rgba(15,118,110,.07)}
html{-webkit-text-size-adjust:100%}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:active{transform:scale(.98)}button:disabled{cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#rcpt{display:none}
#rcpt.show{display:block;position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:9;padding:14px}
.paper{background:#fff;color:#000;width:105mm;max-width:100%;min-height:148mm;margin:10px auto;padding:7mm 6mm;font:12px/1.25 "Courier New",monospace}
.paper hr{border:0;border-top:1px dashed #000;margin:5px 0}.paper .r{display:flex;justify-content:space-between;gap:6px}.paper .c{text-align:center}.paper .c3{display:grid;grid-template-columns:1fr 1fr 1fr}.paper .c3>*:nth-child(2){text-align:center}.paper .c3>*:nth-child(3){text-align:right}.paper .tag2{text-align:center;font-weight:700;letter-spacing:1px;border:1px solid #000;padding:3px 0;margin-bottom:6px;font-size:11px;line-height:1.2}.paper .sg{margin-top:8px;break-inside:avoid}.paper .sgnspace{height:2.6em;clear:both}.paper .sg1{display:flex;justify-content:space-between;align-items:flex-end;gap:3mm;font-size:10px;break-inside:avoid}.paper .sg1 .f{display:flex;flex-direction:column}.paper .sg1 .ln{border-bottom:1px solid #000;height:1.1em;width:55mm}.paper .sg1 .dt .ln{width:25mm;margin-left:auto}.paper .sg1 span{white-space:nowrap}.paper .ack{font-size:10px;margin-top:6px}

@page{size:A6;margin:0}

<body>
<div class="bgfx" id="bgfx" aria-hidden="true"></div>
<div id="app"></div>
<nav class="noprint"><button data-t="home">Home</button><button data-t="inv">Sale</button><button data-t="cus">Dealers</button><button data-t="sal">Report</button><button data-t="set">Settings</button></nav>
<div id="rcpt"></div>
<script>
var DB={settings:{biz:'My Business',addr:'',phone:'',cur:'₱',remind:5,notify:false,footer:'Thank you for your business!'},customers:[],invoices:[],seq:1,notified:{}};
var tab='home',KEY='invoiceKeeper.v1';
function normDB(d){
  if(!d||typeof d!=='object')d={};
  d.settings=Object.assign({biz:'My Business',addr:'',phone:'',cur:'₱',remind:5,notify:false,footer:'Thank you for your business!'},d.settings||{});
  if(!Array.isArray(d.customers))d.customers=[];
  if(!Array.isArray(d.invoices))d.invoices=[];
  var mx=0;d.invoices.forEach(function(i){if(!Array.isArray(i.items))i.items=[];var n=parseInt(i.no,10);if(n>mx)mx=n});
  d.seq=Math.max(+d.seq||1,mx+1);
  if(!d.notified||typeof d.notified!=='object')d.notified={};
  return d}
function load(){try{var s=localStorage.getItem(KEY);if(s)DB=normDB(JSON.parse(s))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}queueBackup()}

/* ===== device backup: silent file writes where supported, automatic download elsewhere ===== */
var BK_LAST='invoiceKeeper.lastBackup';
var bkHandle=null,bkIDB=null,bkTimer=null,bkBusy=false,bkNeedFix=false,bkReady=false,bkSkip=false;
function bkMode(){return DB.settings.backupMode||''}
function bkStatus(){if(bkNeedFix)return 'fix';if(bkHandle)return 'file';if(bkMode()==='download')return 'download';return 'off'}
function bkOn(){var s=bkStatus();return s==='file'||s==='download'}
function bkLast(){try{return Number(localStorage.getItem(BK_LAST)||0)}catch(e){return 0}}
function bkStamp(){var v=bkLast();if(!v)return 'never';var d=new Date(v);return isNaN(d.getTime())?'never':d.toLocaleString()}
function bkSaved(){try{localStorage.setItem(BK_LAST,String(Date.now()))}catch(e){}bkNeedFix=false;bkRefresh()}
function bkRefresh(){var e=document.getElementById('bkStatus');if(e)e.textContent='Last backup: '+bkStamp();
  var t=document.getElementById('bkTitle');if(t){var on=bkOn();t.textContent=on?'ON':'OFF';t.className=on?'tag grn':'tag red'}}
function bkText(){return JSON.stringify(DB,null,2)}
function bkDb(cb){
  if(bkIDB){cb(bkIDB);return}
  if(!window.indexedDB){cb(null);return}
  try{var r=indexedDB.open('invoiceKeeperBackup',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('files')};
    r.onsuccess=function(){bkIDB=r.result;cb(bkIDB)};
    r.onerror=function(){cb(null)}
  }catch(e){cb(null)}
}
function bkLoadHandle(cb){
  bkDb(function(db){if(!db){cb(null);return}
    try{var q=db.transaction('files','readonly').objectStore('files').get('backup');
      q.onsuccess=function(){cb(q.result||null)};q.onerror=function(){cb(null)}
    }catch(e){cb(null)}})
}
function bkStoreHandle(h){bkDb(function(db){if(!db)return;try{db.transaction('files','readwrite').objectStore('files').put(h,'backup')}catch(e){}})}
function bkDownload(text){
  try{var nw=new Date(),n='InvoiceKeeper-backup-'+ymd(nw)+'-'+pad2(nw.getHours())+pad2(nw.getMinutes())+'.json',b=new Blob([text],{type:'application/json'}),
    u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=n;a.style.display='none';document.body.appendChild(a);a.click();
    setTimeout(function(){a.remove();URL.revokeObjectURL(u)},15000);
    bkSaved();return true
  }catch(e){bkNeedFix=true;bkRefresh();return false}
}

  if(cur.cash)return '<label>Customer name (optional)</label><input id="i_nm" list="dl" autocomplete="off" placeholder="Type a name, or pick a saved dealer" value="'+esc(cur.name||'')+'"><datalist id="dl">'+dsorted().map(function(c){return '<option value="'+esc(c.name)+'">'}).join('')+'</datalist>';
  if(!DB.customers.length)return '<div class="card" style="border-color:var(--amb)"><div class="b">Pay later is for dealers only</div><div class="mut" style="margin:4px 0 10px">Add a dealer first, or switch Cash payment on.</div><button class="s sm" onclick="closeSheet();tab=\'cus\';render();editCus()">+ Add a dealer</button></div>';
  var cn=(cur.name||'').toLowerCase();
  return '<label>Dealer</label><select id="i_nm"><option value="">Choose a dealer</option>'+dsorted().map(function(c){return '<option value="'+esc(c.name)+'"'+(c.name.toLowerCase()===cn?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')+'</select>';
}
function drawInv(){
  var s=document.querySelector('.sheet');if(s)s.remove();
  var h='<h1>'+(cur.id?'Edit':'New')+' sale</h1><label class="row" style="background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px"><span class="b">Cash payment<br><span class="mut" style="font-weight:400">'+(cur.cash?'Paid now · no due date':'Pay later · set a due date')+'</span></span><input type="checkbox" id="i_cash" style="width:26px;height:26px;margin:0"'+(cur.cash?' checked':'')+' onchange="setCash(this.checked)"></label>'+nameField()+'<div class="g2"><div'+(cur.cash?'':' style="grid-column:1/-1"')+'><label>Invoice no.</label><input id="i_no" value="'+esc(cur.no)+'"></div><div><label>Date</label><input id="i_d" type="date" value="'+esc(cur.date)+'"></div>'+(cur.cash?'':'<div><label>Due date</label><input id="i_due" type="date" value="'+esc(cur.due)+'"></div>')+'</div><h2>Items</h2>';
  cur.items.forEach(function(x,k){h+='<div class="card"><label>Item description</label><input placeholder="e.g. Rice 25kg" value="'+esc(x.d)+'" oninput="cur.items['+k+'].d=this.value"><div class="g2"><div><label>Quantity</label><input type="number" inputmode="decimal" min="0" value="'+esc(x.qty)+'" oninput="itemCh('+k+',\'qty\',this.value)"></div><div><label>Original price</label><input type="number" inputmode="decimal" min="0" placeholder="0.00" value="'+esc(x.price)+'" oninput="itemCh('+k+',\'price\',this.value)"></div><div><label>Discount %</label><input type="number" inputmode="decimal" min="0" max="100" placeholder="0" value="'+(x.disc||'')+'" oninput="itemCh('+k+',\'disc\',this.value)"></div><div><label>Discounted price</label><input id="dp'+k+'" readonly tabindex="-1" value="'+dshow(x)+'"></div></div><div class="row"><span class="mut">Line total: <b id="lt'+k+'">'+money(lineT(x))+'</b></span><button class="d sm" onclick="cur.items.splice('+k+',1);syncTop();drawInv()">Remove</button></div></div>'});
  h+='<button class="s sm" onclick="syncTop();cur.items.push({d:\'\',qty:1,price:\'\'});drawInv()">+ Add item</button><div class="row" style="margin:12px 0"><span class="b">Total</span><span class="b" id="tot" style="font-size:20px">'+money(total(cur))+'</span></div><label>Notes</label><textarea id="i_n" rows="2">'+esc(cur.notes)+'</textarea><div class="row" style="margin-top:12px"><button class="s" onclick="closeSheet()">Cancel</button>'+(cur.id?'<button class="d" onclick="delInv()">Delete</button>':'')+'<button onclick="saveInv()">Save</button></div>';
  sheet(h);
}
function itemCh(k,f,v){var x=cur.items[k];x[f]=v;var d=document.getElementById('dp'+k);if(d)d.value=dshow(x);var l=document.getElementById('lt'+k);if(l)l.textContent=money(lineT(x));tot()}
function tot(){$('#tot').textContent=money(total(cur))}
function syncTop(){if(!$('#i_no'))return;cur.no=$('#i_no').value;cur.name=$('#i_nm')?$('#i_nm').value.trim():'';cur.date=$('#i_d').value;cur.due=cur.cash?cur.date:($('#i_due')?$('#i_due').value:cur.due);cur.notes=$('#i_n').value;cur.paid=cur.cash?true:($('#i_p')?$('#i_p').checked:cur.paid)}
function saveInv(){
  syncTop();
  if(!cur.date||!cur.due){toast('Set the date and due date');return}
  if(!cur.cash&&!DB.customers.some(function(c){return c.name.toLowerCase()===cur.name.toLowerCase()})){toast('A sale with a due date must be for a saved dealer. Choose a dealer, or switch Cash payment on.');return}
  var nm=cur.name;if(nm){var f=DB.customers.find(function(c){return c.name.toLowerCase()===nm.toLowerCase()});cur.cid=f?f.id:'';cur.name=f?f.name:nm}else{cur.cid='';cur.name=''}
  cur.items=cur.items.filter(function(x){return x.d||+x.price});
  if(!cur.items.length){toast('Add at least one item');return}
  if(cur.items.some(function(x){return !(+x.qty>0)})){toast('Enter a quantity for every item');return}
  if(!cur.cash&&(cur.payments||[]).length){var due0=amountDue(cur),fee0=lateFee(cur),np=Math.round((due0-paidAmt(cur))*100)/100<=0.005;if(np&&!cur.paid)cur.fee=fee0;cur.paid=np}
  if(cur.id){DB.invoices=DB.invoices.map(function(x){return x.id===cur.id?cur:x})}else{cur.id=uid();DB.invoices.push(cur);DB.seq++}
  save();var id=cur.id;closeSheet();notifyDue();openInv(id);
}
function delInv(){ask('Delete this invoice?','Delete',function(){DB.invoices=DB.invoices.filter(function(x){return x.id!==cur.id});save();closeSheet()})}

function openInv(id){

  var lines=i.items.map(function(x){var q=+x.qty||0,dd=+x.disc||0;return '<div class="r"><span>'+esc(x.d)+' x'+q+'</span><b>'+money(lineT(x))+'</b></div><div class="r c3"><span>'+money(+x.price||0)+'</span><span>'+(dd>0?dd+'%':'-')+'</span><span>'+money(dprice(x))+'</span></div>'}).join('');

function closeRcpt(){$('#rcpt').className='';$('#rcpt').innerHTML='';render()}
function togglePaid(id){
  var i=DB.invoices.find(function(x){return x.id===id});if(!i)return;
  if(i.paid){
    if(i.cash){toast('Cash sales are already paid. Edit the sale and switch Cash payment off if it should be pay later.');return}
    ask('Mark this invoice unpaid? Its payment history will be cleared.','Mark unpaid',function(){i.paid=false;i.payments=[];i.fee=0;delete i.paidDate;save();openInv(id)});
    return}
  var m=applyPayment(i,balance(i),ymd(new Date()));if(m){save();openInv(id);toast(m)}
}
