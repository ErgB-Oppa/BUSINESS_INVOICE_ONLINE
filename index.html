<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invoice Keeper</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#6b7380;--ac:#0f766e;--acx:#fff;--bd:#e2e5ea;--red:#c62828;--amb:#b45309;--grn:#15803d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1e2329;--tx:#eceff3;--mut:#98a2b0;--ac:#2dd4bf;--acx:#06201d;--bd:#2f363f;--red:#ef6b6b;--amb:#f0a64a;--grn:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1e2329;--tx:#eceff3;--mut:#98a2b0;--ac:#2dd4bf;--acx:#06201d;--bd:#2f363f;--red:#ef6b6b;--amb:#f0a64a;--grn:#4ade80;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
#app{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:15px;margin:16px 0 8px;color:var(--mut);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:13px}.b{font-weight:600}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.red{color:var(--red)}.amb{color:var(--amb)}.grn{color:var(--grn)}
button{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:var(--ac);color:var(--acx);font-weight:600}
button.s{background:transparent;color:var(--ac);border:1px solid var(--bd)}button.d{background:transparent;color:var(--red);border:1px solid var(--bd)}
button.sm{padding:6px 10px;font-size:14px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin:4px 0 10px}
label{font-size:13px;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:12px 4px;font-size:13px}nav button.on{color:var(--ac)}
.banner{background:var(--card);border:1px solid var(--amb);border-left-width:5px;border-radius:12px;padding:12px;margin-bottom:12px}
.sheet{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 40px;z-index:5}
.sheet>div{max-width:640px;margin:0 auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{display:grid;grid-template-columns:1fr 60px 90px 34px;gap:6px;align-items:start}.item input{margin:0 0 6px}
.bar{height:8px;border-radius:99px;background:var(--bd);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac)}.sub{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);padding:2px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow{text-align:center;font-size:12px;color:var(--mut)}
.day{min-height:54px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:4px;display:flex;flex-direction:column;justify-content:space-between;font-size:12px;overflow:hidden}
.day.has{border-color:var(--ac)}.day.has b{color:var(--ac);font-size:12px;word-break:break-all}.day.tod span{font-weight:700;text-decoration:underline}.day.sel{background:var(--ac);color:var(--acx)}.day.sel b{color:var(--acx)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:99;max-width:90%;text-align:center}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}.dlg .box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;max-width:340px;width:100%}
input[readonly]{background:var(--card);font-weight:600}
.bgfx{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;background:radial-gradient(60% 45% at 10% 6%,color-mix(in srgb,var(--ac) 16%,transparent),transparent 70%),radial-gradient(55% 40% at 95% 32%,color-mix(in srgb,#f59e0b 12%,transparent),transparent 70%),radial-gradient(70% 50% at 28% 100%,color-mix(in srgb,#ec4899 11%,transparent),transparent 70%)}
.bgfx::before{content:"";position:absolute;inset:0;background-image:radial-gradient(currentColor 1px,transparent 1.5px);background-size:22px 22px;opacity:.06;color:var(--tx)}
.nv{position:absolute;font-family:Impact,"Arial Black","Helvetica Neue",system-ui,sans-serif;font-weight:900;white-space:nowrap;user-select:none;letter-spacing:.07em;color:var(--ac);will-change:transform;animation:nvf var(--d) ease-in-out var(--dl) infinite alternate}
.nv.b{color:#f59e0b;--nc:#f59e0b}.nv.c{color:#ec4899;--nc:#ec4899}.nv.d{color:var(--tx);--nc:var(--tx)}
.nv.g{background:linear-gradient(90deg,var(--ac),#f59e0b,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.nv.o{color:transparent;-webkit-text-stroke:1.5px var(--nc,var(--ac))}
.sp{position:absolute;color:var(--ac);opacity:.25;animation:tw 4s ease-in-out var(--dl) infinite alternate}
@keyframes nvf{from{transform:translate(0,0) rotate(var(--r))}to{transform:translate(var(--x),var(--y)) rotate(calc(var(--r) + var(--dr)))}}
@keyframes tw{from{opacity:.05;transform:scale(.7)}to{opacity:.38;transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.nv{animation:none;transform:rotate(var(--r))}.sp{animation:none}}
#app{position:relative;z-index:1}nav{z-index:3}
#rcpt{display:none}
#rcpt.show{display:block;position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:9;padding:14px}
.paper{background:#fff;color:#000;width:105mm;max-width:100%;min-height:148mm;margin:10px auto;padding:7mm 6mm;font:12px/1.25 "Courier New",monospace}
.paper hr{border:0;border-top:1px dashed #000;margin:5px 0}.paper .r{display:flex;justify-content:space-between;gap:6px}.paper .c{text-align:center}.paper .c3{display:grid;grid-template-columns:1fr 1fr 1fr}.paper .c3>*:nth-child(2){text-align:center}.paper .c3>*:nth-child(3){text-align:right}.paper .tag2{text-align:center;font-weight:700;letter-spacing:1px;border:1px solid #000;padding:3px 0;margin-bottom:6px;font-size:11px;line-height:1.2}.paper .sg{margin-top:8px;break-inside:avoid}.paper .sl{margin-top:20px;border-top:1px solid #000;padding-top:2px;font-size:10px}.paper .g2s{display:grid;grid-template-columns:1.7fr 1fr;gap:6mm}.paper .ack{font-size:10px;margin-top:6px}
@media print{body{background:#fff;padding:0}#app,nav,.noprint,.sheet{display:none!important}#rcpt.show{position:static;display:block;padding:0;background:#fff}.paper{margin:0;width:105mm;min-height:147mm;break-after:page;page-break-after:always}.paper:last-child{break-after:auto;page-break-after:auto}.bgfx{display:none!important}}
@page{size:A6;margin:0}
</style>
</head>
<body>
<div class="bgfx" id="bgfx" aria-hidden="true"></div>
<div id="app"></div>
<nav class="noprint"><button data-t="home">Home</button><button data-t="inv">Sale</button><button data-t="cus">Dealers</button><button data-t="sal">Report</button><button data-t="set">Settings</button></nav>
<div id="rcpt"></div>
<script>
var DB={settings:{biz:'My Business',addr:'',phone:'',cur:'₱',remind:5,notify:false,footer:'Thank you for your business!'},customers:[],invoices:[],seq:1,notified:{}};
var tab='home',KEY='invoiceKeeper.v1';
function load(){try{var s=localStorage.getItem(KEY);if(s){var d=JSON.parse(s);DB=Object.assign(DB,d);DB.settings=Object.assign({biz:'My Business',addr:'',phone:'',cur:'₱',remind:5,notify:false,footer:''},d.settings||{})}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function money(n){return DB.settings.cur+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function ymd(d){var z=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function daysTo(s){return Math.round((pd(s)-today())/864e5)}
function dprice(x){var d=Math.min(100,Math.max(0,+x.disc||0)),p=+x.price||0;return d>0?Math.round(p*(100-d)/100):p}
function dshow(x){var v=dprice(x);return v%1===0?String(v):v.toFixed(2)}
function lineT(x){return (+x.qty||0)*dprice(x)}
function total(i){return (i.items||[]).reduce(function(a,x){return a+lineT(x)},0)}
function nmo(i){return i.name||(i.cid?cust(i.cid).name:'')}
function inm(i){return nmo(i)||(i.cash?'Cash sale':'Walk-in')}
function cust(id){if(!id)return{name:'Cash sale',phone:''};return DB.customers.find(function(c){return c.id===id})||{name:'(deleted dealer)',phone:''}}
function fdate(s){return pd(s).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})}
function dueList(){var r=+DB.settings.remind||5;return DB.invoices.filter(function(i){return !i.paid&&daysTo(i.due)<=r}).sort(function(a,b){return a.due<b.due?-1:1})}
function dueTag(i){if(i.paid)return '<span class="tag grn">'+(i.cash?'Cash':'Paid')+'</span>';var d=daysTo(i.due);if(d<0)return '<span class="tag red">Overdue '+(-d)+'d</span>';if(d===0)return '<span class="tag red">Due today</span>';if(d<=(+DB.settings.remind||5))return '<span class="tag amb">Due in '+d+'d</span>';return '<span class="tag mut">Due '+fdate(i.due)+'</span>'}

function notifyDue(force){
  var l=dueList(),t=ymd(new Date());
  if(!DB.settings.notify||!('Notification' in window)||Notification.permission!=='granted')return;
  l.forEach(function(i){
    if(!force&&DB.notified[i.id]===t)return;
    DB.notified[i.id]=t;
    var d=daysTo(i.due),msg=(d<0?'Overdue by '+(-d)+' day(s)':d===0?'Due today':'Due in '+d+' day(s)')+' · '+money(total(i));
    var title='Invoice '+i.no+' – '+inm(i);
    try{if(navigator.serviceWorker&&navigator.serviceWorker.ready){navigator.serviceWorker.ready.then(function(r){r.showNotification(title,{body:msg})}).catch(function(){new Notification(title,{body:msg})})}else{new Notification(title,{body:msg})}}catch(e){try{new Notification(title,{body:msg})}catch(x){}}
  });
  save();
}

function render(){
  document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.t===tab)});
  var h='';
  if(tab==='home')h=vHome();else if(tab==='inv')h=vInv();else if(tab==='cus')h=vCus();else if(tab==='sal')h=vSales();else h=vSet();
  $('#app').innerHTML=h;
}
function invRow(i){return '<div class="card" onclick="openInv(\''+i.id+'\')"><div class="row"><div><div class="b">#'+esc(i.no)+' · '+esc(inm(i))+'</div><div class="mut">'+(i.cash?'Cash · '+fdate(i.date):'Due '+fdate(i.due))+'</div></div><div style="text-align:right"><div class="b">'+money(total(i))+'</div>'+dueTag(i)+'</div></div></div>'}
function vHome(){
  var l=dueList(),unpaid=DB.invoices.filter(function(i){return !i.paid}),owed=unpaid.reduce(function(a,i){return a+total(i)},0);
  var tk=ymd(new Date()),td=DB.invoices.filter(function(i){return i.date===tk}),tc=td.filter(function(i){return i.cash});
  var ts=function(a){return a.reduce(function(x,i){return x+total(i)},0)};
  var h='<div class="row"><h1>'+esc(DB.settings.biz)+'</h1><button class="s sm" onclick="cycleTheme()" aria-label="Change theme">'+themeIcon()+'</button></div><div class="card"><div class="mut">Daily sale · '+new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})+'</div><div class="b" style="font-size:26px;margin:2px 0">'+money(ts(td))+'</div><div class="mut">'+td.length+' sale'+(td.length===1?'':'s')+' today · Cash '+money(ts(tc))+' · Pay later '+money(ts(td)-ts(tc))+'</div></div>';
  if(l.length)h+='<div class="banner"><div class="b">⏰ '+l.length+' invoice'+(l.length>1?'s':'')+' due within '+(+DB.settings.remind||5)+' days or overdue</div></div>'+l.map(invRow).join('');
  else h+='<div class="card mut">Nothing due soon. 🎉</div>';
  h+='<div class="g2"><div class="card"><div class="mut">Unpaid total</div><div class="b" style="font-size:20px">'+money(owed)+'</div></div><div class="card"><div class="mut">Dealers</div><div class="b" style="font-size:20px">'+DB.customers.length+'</div></div></div>';
  h+='<button style="width:100%" onclick="editInv()">+ New sale</button>';
  return h;
}
function vInv(){
  var l=DB.invoices.slice().sort(function(a,b){return a.paid-b.paid||(a.due<b.due?-1:1)});
  return '<h1>Sale</h1><button style="width:100%;margin-bottom:12px" onclick="editInv()">+ New sale</button>'+(l.length?l.map(invRow).join(''):'<div class="card mut">No sales yet.</div>');
}
function pdfSan(t){return String(t==null?'':t).replace(/\u20b1/g,'PHP ').replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"').replace(/[\u2013\u2014]/g,'-').replace(/\u2026/g,'...').replace(/[\u00a0\u2007\u2009\u202f]/g,' ').replace(/[\r\n\t]+/g,' ').replace(/[^\x20-\xff]/g,'?')}
function pdfEsc(t){return t.replace(/[\\()]/g,'\\$&').replace(/[^\x20-\x7e]/g,function(c){return '\\'+('00'+c.charCodeAt(0).toString(8)).slice(-3)})}
function buildReceiptsPdf(){
  var PW=595,PH=842,M=40,S=DB.settings,pages=[],pg,y,now=new Date(),RED='0.78 0.16 0.16',GRAY='0.45 0.45 0.45',cur=null;
  function tw(str,sz){var w=0;for(var k=0;k<str.length;k++){var c=str.charAt(k);w+=(c>='0'&&c<='9')?.556:(c==='.'||c===','||c===' '||c==="'"||c==='|'||c==='i'||c==='l'||c==='I'||c==='t'||c==='f')?.278:/[A-Z]/.test(c)?.667:/[mw]/.test(c)?.8:.55}return w*sz}
  function T(x,sz,b,str,o){o=o||{};str=pdfSan(str);if(o.r)x=x-tw(str,sz);pg.push((o.c?o.c+' rg ':'')+'BT /F'+(b?2:1)+' '+sz+' Tf '+x.toFixed(1)+' '+y.toFixed(1)+' Td ('+pdfEsc(str)+') Tj ET'+(o.c?' 0 g':''))}
  function R(){pg.push('0.6 G 0.5 w '+M+' '+y.toFixed(1)+' m '+(PW-M)+' '+y.toFixed(1)+' l S 0 G')}
  function head(){T(M+8,9,true,'Invoice');T(M+70,9,true,'Date');T(M+150,9,true,'Due date');T(M+235,9,true,'Status');T(PW-M,9,true,'Amount',{r:1});y-=5;R();y-=14}
  function np(first){pg=[];pages.push(pg);y=PH-M-8;if(!first){T(M,10,true,(S.biz||'My Business')+' - Receipts backup');y-=22}}
  function need(h){if(y-h<M+24){np(false);head();if(cur){T(M,10,true,cur+' (continued)');y-=15}}}
  function cut(){y-=4;T(M,7,false,'CUT HERE',{c:GRAY});y-=4;pg.push('0.5 G 0.8 w [5 4] 0 d '+M+' '+y.toFixed(1)+' m '+(PW-M)+' '+y.toFixed(1)+' l S [] 0 d 0 G');y-=18}
  function items(i){var t=(i.items||[]).map(function(x){var dd=+x.disc||0;return (x.d||'item')+' x'+(+x.qty||0)+(dd>0?' ('+dd+'% off)':'')}).join(', ');return t.length>105?t.slice(0,102)+'...':t}
  function full(c){return ((firstOf(c)||'')+' '+(lastOf(c)||'')).trim()||c.name}
  var sum=function(a){return a.reduce(function(x,i){return x+total(i)},0)};
  var byDate=function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.no<b.no?-1:1)};
  var groups=[],seen={};
  dsorted().forEach(function(c){var l=dinv(c).slice().sort(byDate);l.forEach(function(i){seen[i.id]=1});groups.push({n:full(c),ph:c.phone,em:c.email,ad:c.address,l:l})});
  var rest=DB.invoices.filter(function(i){return !i.cash&&!seen[i.id]}).sort(byDate);
  if(rest.length)groups.push({n:'(Not linked to a saved dealer)',l:rest});
  var all=[];groups.forEach(function(g){all=all.concat(g.l)});
  var paidAll=sum(all.filter(function(i){return i.paid})),billed=sum(all);
  var od=all.filter(function(i){return !i.paid&&daysTo(i.due)<0});
  np(true);
  T(M,16,true,S.biz||'My Business');y-=22;
  T(M,12,true,'Dealer receipts backup');y-=16;
  T(M,9,false,'Generated '+now.toLocaleString()+'  |  every recorded transaction of every dealer, A to Z by last name');y-=15;
  T(M,10,false,'Dealers: '+DB.customers.length+'     Transactions: '+all.length+'     Billed: '+money(billed));y-=14;
  T(M,10,false,'Paid: '+money(paidAll)+'     Unpaid: '+money(billed-paidAll)+(od.length?'     Overdue: '+money(sum(od)):''));y-=20;
  if(!groups.length){T(M,11,false,'No dealers yet.')}
  else{head();groups.forEach(function(g,idx){
    var rows=g.l.length,contact=[g.ph,g.em,g.ad].filter(Boolean).join('  |  ');
    var h=15+(contact?12:0)+8+Math.max(rows,1)*23+26;
    cur=null;
    if(y-h<M+24&&h<=PH-2*M-70){np(false);head()}else if(idx>0){cut()}
    need(15+(contact?12:0)+8+23);
    T(M,11,true,g.n);T(PW-M,9,false,rows+' transaction'+(rows===1?'':'s'),{r:1});y-=14;
    if(contact){T(M,8.5,false,contact,{c:GRAY});y-=12}
    y-=4;cur=g.n;
    if(!rows){T(M+8,9,false,'No transactions yet.',{c:GRAY});y-=16}
    g.l.forEach(function(i){need(24);var d=daysTo(i.due),st,o={},late=false;
      if(i.paid){st=i.cash?'Paid (cash)':'Paid'}else{st=d<0?'OVERDUE '+(-d)+'d':d===0?'DUE TODAY':'Due in '+d+'d';if(d<=0){o={c:RED};late=true}}
      T(M+8,9.5,false,'#'+i.no);T(M+70,9.5,false,fdate(i.date));T(M+150,9.5,false,i.cash?'-':fdate(i.due),o);T(M+235,9.5,late,st,o);T(PW-M,9.5,false,money(total(i)),{r:1});y-=11;
      T(M+8,8,false,'Items: '+items(i),{c:GRAY});y-=13});
    var gt=sum(g.l),gp=sum(g.l.filter(function(i){return i.paid}));
    need(24);y-=2;R();y-=12;
    T(PW-M,9.5,true,'Billed '+money(gt)+'     Paid '+money(gp)+'     Unpaid '+money(gt-gp),{r:1});y-=14;cur=null})}
  pages.forEach(function(p,k){p.push('BT /F1 8 Tf '+M+' 22 Td ('+pdfEsc('Page '+(k+1)+' of '+pages.length)+') Tj ET')});
  var objs=[],n=pages.length,kids=[];
  for(var k=0;k<n;k++)kids.push((5+2*k)+' 0 R');
  objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
  objs[2]='<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>';
  objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  for(var j=0;j<n;j++){var c=pages[j].join('\n');
    objs[5+2*j]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+(6+2*j)+' 0 R >>';
    objs[6+2*j]='<< /Length '+c.length+' >>\nstream\n'+c+'\nendstream'}
  var out='%PDF-1.4\n',off=[];
  for(var q=1;q<objs.length;q++){off[q]=out.length;out+=q+' 0 obj\n'+objs[q]+'\nendobj\n'}
  var xr=out.length;out+='xref\n0 '+objs.length+'\n0000000000 65535 f \n';
  for(var r=1;r<objs.length;r++)out+=('0000000000'+off[r]).slice(-10)+' 00000 n \n';
  out+='trailer\n<< /Size '+objs.length+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';
  var u=new Uint8Array(out.length);for(var z=0;z<out.length;z++)u[z]=out.charCodeAt(z)&255;return u}
function rcptBackup(){
  var bytes;try{bytes=buildReceiptsPdf()}catch(e){toast('Could not build the PDF.');return}

  cur.items=cur.items.filter(function(x){return x.d||+x.price});
  if(!cur.items.length){toast('Add at least one item');return}
  if(cur.id){DB.invoices=DB.invoices.map(function(x){return x.id===cur.id?cur:x})}else{cur.id=uid();DB.invoices.push(cur);DB.seq++}
  save();var id=cur.id;closeSheet();notifyDue();openInv(id);
}
function delInv(){ask('Delete this invoice?','Delete',function(){DB.invoices=DB.invoices.filter(function(x){return x.id!==cur.id});save();closeSheet()})}
var DLP=null;
function getDl(){if(!DLP)DLP=(window.claude&&window.claude.use)?window.claude.use('downloads').catch(function(){return null}):Promise.resolve(null);return DLP}
function doPrint(){try{window.print()}catch(e){}if(window.self!==window.top)setTimeout(function(){toast('No print window? Tap Save receipt, then open the saved file and press Print.')},1200)}
function saveRcpt(id){
  var i=DB.invoices.find(function(x){return x.id===id}),p=document.querySelectorAll('#rcpt .paper');if(!i||!p.length)return;
  var html='<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice '+esc(i.no)+'</title><style>body{margin:0;background:#f4f5f7;font-family:system-ui,sans-serif}.paper{background:#fff;color:#000;width:105mm;max-width:100%;min-height:148mm;margin:10px auto;padding:7mm 6mm;font:12px/1.25 "Courier New",monospace}.paper hr{border:0;border-top:1px dashed #000;margin:5px 0}.paper .r{display:flex;justify-content:space-between;gap:6px}.paper .c{text-align:center}.paper .c3{display:grid;grid-template-columns:1fr 1fr 1fr}.paper .c3>*:nth-child(2){text-align:center}.paper .c3>*:nth-child(3){text-align:right}.paper .tag2{text-align:center;font-weight:700;letter-spacing:1px;border:1px solid #000;padding:3px 0;margin-bottom:6px;font-size:11px;line-height:1.2}.paper .sg{margin-top:8px;break-inside:avoid}.paper .sl{margin-top:20px;border-top:1px solid #000;padding-top:2px;font-size:10px}.paper .g2s{display:grid;grid-template-columns:1.7fr 1fr;gap:6mm}.paper .ack{font-size:10px;margin-top:6px}.bar{text-align:center;padding:12px}button{font:inherit;padding:10px 18px;border:0;border-radius:10px;background:#0f766e;color:#fff}@media print{body{background:#fff}.bar{display:none}.paper{margin:0;break-after:page}.paper:last-child{break-after:auto}}@page{size:A6;margin:0}</style></head><body><div class="bar"><button onclick="window.print()">Print</button></div>'+Array.prototype.map.call(p,function(e){return e.outerHTML}).join('')+'</body></html>';
  getDl().then(function(d){if(!d){toast('Saving is not available here.');return}
    d.save({filename:'Invoice-'+String(i.no).replace(/[^\w-]+/g,'_')+'.html',data:html}).then(function(){toast('Receipt saved')}).catch(function(e){if(!e||e.code!=='declined')toast('Could not save the receipt.')})})
}
function paperHtml(i,lines,label){
  var s=DB.settings,pl=!i.cash;
  return '<div class="paper">'+(label?'<div class="tag2">'+esc(label)+'</div>':'')+'<div class="c"><b style="font-size:15px">'+esc(s.biz)+'</b>'+((s.addr||s.phone)?'<br>'+esc([s.addr,s.phone].filter(Boolean).join(' | ')):'')+'</div><hr><div class="r"><span>Invoice #'+esc(i.no)+'</span><span>'+fdate(i.date)+'</span></div>'+(nmo(i)?'<div>'+(i.cid?'Dealer: ':'Customer: ')+esc(nmo(i))+'</div>':'')+'<hr><div class="r c3"><b>Orig. price</b><b>Disc %</b><b>Disc. price</b></div>'+lines+'<hr><div class="r"><b>TOTAL</b><b>'+money(total(i))+'</b></div><div class="r"><span>'+(i.paid?'PAID'+(i.cash?' (cash)':''):'UNPAID')+'</span><span>'+(i.paid?'':'Due '+fdate(i.due))+'</span></div>'+(i.notes?'<div>'+esc(i.notes)+'</div>':'')+(pl?'<div class="ack">I received the items listed above and agree to pay the total by the due date.</div><div class="sg"><div class="g2s"><div class="sl">Received by (print name)</div><div class="sl">Date</div></div><div class="sl">Signature</div></div>':'')+(s.footer?'<div class="c" style="margin-top:6px">'+esc(s.footer)+'</div>':'')+'</div>'}
function openInv(id){
  var i=DB.invoices.find(function(x){return x.id===id});if(!i)return;var c=i.cid?cust(i.cid):{phone:''},s=DB.settings;
  var lines=i.items.map(function(x){var q=+x.qty||0,dd=+x.disc||0;return '<div class="r"><span>'+esc(x.d)+' x'+q+'</span><b>'+money(lineT(x))+'</b></div><div class="r c3"><span>'+money(+x.price||0)+'</span><span>'+(dd>0?dd+'%':'-')+'</span><span>'+money(dprice(x))+'</span></div>'}).join('');
  $('#rcpt').innerHTML='<div class="noprint row" style="max-width:640px;margin:0 auto;flex-wrap:wrap;row-gap:8px"><button class="s" onclick="closeRcpt()">← Back</button><button class="s" onclick="editInv(\''+id+'\');closeRcpt()">Edit</button><button class="s" onclick="togglePaid(\''+id+'\')">'+(i.paid?'Mark unpaid':'Mark paid')+'</button><button onclick="doPrint()">🖨 Print</button><button class="s" id="svb" style="display:none" onclick="saveRcpt(\''+id+'\')">Save receipt</button></div>'+
  (i.cash?paperHtml(i,lines,''):paperHtml(i,lines,'DEALER COPY')+paperHtml(i,lines,'STORE COPY - keep for records'));
  $('#rcpt').className='show';getDl().then(function(d){var b=$('#svb');if(d&&b)b.style.display=''});
}
function closeRcpt(){$('#rcpt').className='';$('#rcpt').innerHTML='';render()}
function togglePaid(id){var i=DB.invoices.find(function(x){return x.id===id});i.paid=!i.paid;save();openInv(id)}

document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){tab=b.dataset.t;render()}});
load();migrate();applyTheme();buildBg();render();notifyDue();
document.addEventListener('visibilitychange',function(){if(!document.hidden){render();notifyDue()}});
</script>
</body>
